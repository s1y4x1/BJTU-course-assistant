<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>局域网聊天室</title>
  <script src="background-mode.js"></script>
  <script src="../../UI/theme.js"></script>
  <script src="../../UI/file-size-emphasis.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="../../UI/file-size-emphasis.css">
  <link rel="stylesheet" href="../../UI/markdown.css">
  <link rel="stylesheet" href="../../UI/toast.css">
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body class="chatroom-page">
  <main class="chat-layout">
    <div id="sidebar-host" aria-busy="true"><p class="muted">正在加载联系人和设置…</p></div>
    <section class="conversation card" aria-label="聊天内容">
      <header class="conversation-header"><div class="conversation-heading"><input id="conversation-title" type="text" value="公共群聊" maxlength="80" aria-label="会话备注" title="直接修改会话备注，回车或离开输入框保存" autocomplete="off"><div id="conversation-detail" class="muted"><div id="conversation-members" class="conversation-members"></div><button id="conversation-members-toggle" class="secondary" type="button" hidden>展开成员</button></div></div><div class="actions conversation-header-actions"><button id="invite-group" class="secondary" hidden>邀请成员</button><button id="leave-group" class="secondary" hidden>退出群聊</button><button id="block-peer" class="secondary" hidden>拉黑</button><button id="delete-friend" class="secondary" hidden>删除好友</button><button id="clear-history" class="secondary" type="button" title="长按 2 秒清空本地记录并停止本会话的文件传输">清空记录</button><label class="conversation-mute"><input id="mute-conversation" type="checkbox">免打扰</label></div></header>
      <div id="messages" class="messages" role="log" aria-label="消息记录" aria-live="polite" aria-relevant="additions"><p class="empty">欢迎来到公共群聊。</p></div>
      <form id="message-form" class="composer"><textarea id="message" rows="3" maxlength="8000" aria-label="消息" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea><div class="composer-footer"><div class="actions"><button id="pick-file" type="button" class="secondary">发送文件</button><input id="file-picker" type="file" multiple hidden><button id="share-screen" type="button" class="secondary">共享屏幕</button><button id="stop-screen" type="button" class="danger" hidden>停止共享</button></div><button id="send" type="submit">发送</button></div></form>
    </section>
  </main>

  <div id="msg" role="status" aria-live="polite"></div>
  <script src="../../UI/options-message.js"></script>
  <script src="engine-lease.js"></script>
  <script src="settings.js"></script>
  <script src="sidebar.js"></script>
  <script src="../../UI/marked.umd.js"></script>
  <script src="../../UI/markdown.js"></script>
  <script src="../../core/option-tips.js"></script>
  <script src="chat.js"></script>
</body>
</html>
