<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>局域网聊天室</title>
  <script src="../../UI/theme.js"></script>
  <script src="../../UI/file-size-emphasis.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="../../UI/file-size-emphasis.css">
  <link rel="stylesheet" href="../../UI/markdown.css">
  <link rel="stylesheet" href="../../UI/toast.css">
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body class="chatroom-page">
  <header class="page-header"><div><h1>局域网聊天室</h1><p class="muted">同一网络，相聚此刻。消息、文件与屏幕点对点直连。</p></div><div class="actions"><button id="disconnect" type="button" class="secondary">断开全部连接</button><button id="retry" type="button">重试引擎</button></div></header>
  <main class="chat-layout">
    <div id="sidebar-host" aria-busy="true"><p class="muted">正在加载联系人和设置…</p></div>
    <section class="conversation card" aria-label="聊天内容">
      <header class="conversation-header"><div><h2 id="conversation-title">公共群聊</h2><span id="conversation-detail" class="muted">所有在线用户</span></div><div class="actions"><button id="invite-group" class="secondary" hidden>邀请成员</button><button id="leave-group" class="secondary" hidden>退出群聊</button></div></header>
      <div id="messages" class="messages" role="log" aria-label="消息记录" aria-live="polite" aria-relevant="additions"><p class="empty">欢迎来到公共群聊。</p></div>
      <form id="message-form" class="composer"><label for="message">消息</label><textarea id="message" rows="3" maxlength="8000" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea><div class="composer-footer"><div class="actions"><button id="pick-file" type="button" class="secondary">发送文件</button><input id="file-picker" type="file" multiple hidden><button id="share-screen" type="button" class="secondary">共享屏幕</button><button id="stop-screen" type="button" class="danger" hidden>停止共享</button></div><button id="send" type="submit">发送</button></div><p class="muted">屏幕共享自动接受，仅观看，不提供远程控制；文件按自动保存设置接收。</p></form>
    </section>
  </main>

  <div id="msg" role="status" aria-live="polite"></div>
  <script src="../../UI/options-message.js"></script>
  <script src="transport.js"></script>
  <script src="link.js"></script>
  <script src="settings.js"></script>
  <script src="sidebar.js"></script>
  <script src="../../UI/marked.umd.js"></script>
  <script src="../../UI/markdown.js"></script>
  <script src="../../core/option-tips.js"></script>
  <script src="chat.js"></script>
</body>
</html>
