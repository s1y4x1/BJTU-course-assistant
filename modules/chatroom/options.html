<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>局域网聊天室选项</title>
  <script src="../../UI/options-message.js"></script>
  <script src="../../UI/theme.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="module-options-standalone" data-options-module="chatroom">
<section class="chatroom-options-card" data-options-fragment>
  <div class="section-title"><a class="module-options-page-link" data-module-options-link="chatroom" href="options.html">局域网聊天室</a></div>
  <label class="chatroom-option-check"><input id="chatroomFullscreenButtonEnabled" type="checkbox" checked><span>在扩展全屏页面上显示「局域网聊天室」按钮</span></label>
  <div class="option-divider" role="separator"></div>
  <template data-chatroom-sidebar-start></template>
      <div class="section-heading chatroom-conversation-heading"><h2>会话</h2><button id="create-group" type="button" class="secondary">新建群聊</button></div>
      <nav id="conversations" aria-label="群聊和私聊会话"></nav>
      <div class="section-heading"><h2>服务器与设备发现</h2></div>
      <label id="chatroomSignalingLabel" for="chatroomSignalingUrl">在线发现服务器 <span id="chatroomSignalingStatus" class="chatroom-server-status" data-state="disconnected" role="status">未连接</span><span class="tip" data-tip-target="#chatroomSignalingLabel">使用 BJTUCA Bridge 聊天室服务器。打开聊天室时自动连接，由服务器为设备安排直连；未连接时可在地址输入框回车重连。跨电脑时请填写同一台服务器的局域网地址，如 ws://192.168.1.2:1897/chatroom。消息、文件与屏幕通过加密直连传输。</span></label>
      <input id="chatroomSignalingUrl" type="url" spellcheck="false" placeholder="ws://127.0.0.1:1897/chatroom">
      <div id="chatroomServerActions" class="actions chatroom-server-actions" hidden><button id="disconnect" type="button" class="secondary">断开连接</button><button id="scan" type="button" class="secondary">刷新发现</button></div>
      <a id="chatroomStartServer" class="option-action-link" href="bjtuca://chatroom?port=1897">启动本机聊天室服务器</a>
      <p class="muted">所有参与者应使用同一个 Bridge 聊天室服务器；无需手动连接设备。跨网络直连可能受防火墙或网络隔离限制。</p>
      <p id="discovery-status" class="muted" role="status">在线发现未启用。</p>
      <details id="pairing-panel"><summary>离线邀请 / 应答配对</summary><p class="muted">无需本地程序或在线信令。甲生成邀请发给乙；乙粘贴邀请并生成应答发回甲；甲提交应答。每份信息 5 分钟内有效，含本地网络候选与身份，仅分享给可信的人。</p><div class="actions"><button id="pair-create" type="button" class="secondary" disabled>生成邀请</button><button id="pair-copy" type="button" class="secondary">复制本机连接信息</button></div><label>本机邀请 / 应答<textarea id="pair-output" rows="4" readonly placeholder="点击生成邀请，或粘贴邀请后生成应答"></textarea></label><label>对方邀请 / 应答<textarea id="pair-input" rows="4" maxlength="262144" placeholder="粘贴对方发送的完整 JSON 信息"></textarea></label><div class="actions"><button id="pair-accept" type="button" disabled>接收邀请并生成应答</button><button id="pair-complete" type="button" class="secondary" disabled>提交对方应答</button></div><p id="pair-status" class="muted" role="status">等待连接引擎。</p></details>
      <details id="settings-panel"><summary>个人设置与隐私</summary><form id="settings-form">
        <label>昵称<input id="nickname" maxlength="40" autocomplete="nickname" required></label>
        <label class="check"><input id="require-friend" type="checkbox">仅好友可以联系我</label>
        <label>群邀请策略<select id="invite-policy"><option value="ask">每次询问</option><option value="allow">允许邀请</option><option value="deny">拒绝全部邀请</option></select></label>
        <div class="chatroom-auto-save-option">
          <label class="check"><input id="chatroomAutoSaveEnabled" type="checkbox" checked><span>自动保存小于</span></label>
          <input id="chatroomAutoSaveValue" type="number" min="0" step="any" placeholder="∞" aria-label="自动保存的文件大小上限，留空表示不设限制">
          <select id="chatroomAutoSaveUnit" aria-label="文件大小单位"><option>B</option><option>KB</option><option selected>MB</option><option>GB</option></select>
          <span>的文件到扩展目录/downloads/</span>
        </div>
        <button id="chatroomAuthorizeDownloads" type="button" class="secondary">授权扩展目录</button>
        <p id="settings-status" class="muted" role="status">更改后自动保存。</p>
      </form><p id="self-info" class="muted"></p><p class="muted">局域网发现不等于身份认证，请核对对方身份。直连会向对方暴露网络地址。</p></details>
      <div class="actions"><button id="sidebar-invite-group" type="button" class="secondary" hidden>邀请成员</button><button id="sidebar-leave-group" type="button" class="secondary" hidden>退出群聊</button></div>
      <details id="sidebar-requests-panel" open><summary>邀请与确认 <span id="request-count">0</span></summary><div id="requests"></div></details>
  <dialog id="editor"><form id="editor-form"><h2 id="editor-title"></h2><div id="editor-fields"></div><div class="actions"><button id="editor-cancel" type="button" class="secondary">取消</button><button type="submit">确定</button></div></form></dialog>
  <div class="option-divider" role="separator"></div>
  <label class="chatroom-option-check"><input id="chatroomAutoReconnectEnabled" type="checkbox" checked><span>连接断开后自动重试</span></label>
  <label class="chatroom-option-check" style="margin-left: 24px"><span>重试间隔</span><input id="chatroomReconnectIntervalSeconds" type="number" min="0.1" max="60" step="0.1" value="5" style="width: 6em"><span>秒</span></label>
  <label class="chatroom-option-check"><input id="chatroomNotifyNewMessages" type="checkbox" checked><span>新消息提醒</span><span class="tip">收到当前未在查看的会话消息时发送系统通知；会话开启免打扰后不发送通知。</span></label>
  <label class="chatroom-option-check"><input id="chatroomBackgroundEnabled" type="checkbox" checked><span>后台保持在线并接收消息</span><span class="tip">关闭聊天室页面后仍保持在线。打开前台时，后台等待正在接收的文件结束后交接；不申请权限或接收屏幕共享。</span></label>
  <label class="chatroom-option-check" style="margin-left: 24px"><input id="chatroomBackgroundReceiveFiles" type="checkbox" checked><span>后台同时接收文件</span><span class="tip">符合自动保存设置且扩展目录已有读写授权时自动接收。否则通过通知询问是否接收；未授权保存目录时，打开聊天室选择保存位置。关闭后台在线时此选项不生效。</span></label>
  <template data-chatroom-sidebar-end></template>
  <a id="chatroomOpen" class="option-action-link" href="/modules/chatroom/chat.html">打开局域网聊天室</a>
</section>
<div id="msg"></div>
<script src="launch.js"></script>
<script src="engine-lease.js"></script>
<script src="transport.js"></script>
<script src="link.js"></script>
<script src="options-lease.js"></script>
  <script src="settings.js"></script>
<script src="sidebar.js"></script>
<script src="options.js"></script>
<script src="../../core/option-tips.js"></script>
<script src="../../core/loaders/module-options-standalone.js"></script>
</body>
</html>
