<div id="upload-duplicate-modal" class="upload-duplicate-modal">
    <div class="upload-duplicate-card">
        <div class="upload-duplicate-header">
            <div class="upload-duplicate-title">检测到可能重复的文件</div>
        </div>
        <div class="upload-duplicate-question">以下文件的 SHA-256 与已上传或正在上传的文件相同，相关上传已暂停。勾选后继续上传；不勾选则复用已有文件，若原文件仍在上传则等待其完成。取消仅取消此列表中的文件，不影响其他上传。列表会随校验结果实时增加；已上传的数据无法撤回。</div>
        <div id="upload-duplicate-list" class="upload-duplicate-list"></div>
        <div class="upload-duplicate-footer">
            <button id="upload-duplicate-invert" class="btn upload-duplicate-secondary" type="button">反选</button>
            <button id="upload-duplicate-confirm" class="btn upload-duplicate-primary" type="button">确定</button>
            <button id="upload-duplicate-cancel" class="btn upload-duplicate-cancel" type="button">取消</button>
        </div>
    </div>
</div>
