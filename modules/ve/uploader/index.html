<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上传至智慧课程平台</title>
  <script src="../../../UI/theme.js"></script>
  <script src="../address.js"></script>
  <script src="../../../UI/file-size-emphasis.js"></script>
  <link rel="stylesheet" href="../../../app/app.css">
  <link rel="stylesheet" href="../../../UI/file-size-emphasis.css">
  <link rel="stylesheet" href="../../../UI/theme.css">
  <link rel="stylesheet" href="index.css">
</head>
<body class="ve-uploader-page">
  <main>
    <div class="upload-section-header"><h1 class="zero-title">文件上传</h1></div>
    <div class="upload-summary-area">
      <div class="upload-total-progress-wrap">
        <div class="upload-total-meta">
          <div id="total-size-info">0 B / 0 B</div>
          <div id="total-percent">0%</div>
          <div id="total-speed">0 KB/s</div>
          <div id="total-eta"></div>
        </div>
        <div class="progress-bar-container"><div id="total-server-bar" class="progress-bar"></div></div>
      </div>
    </div>
    <div id="drop-zone" tabindex="0" role="button" aria-label="选择文件">
      <div class="drop-zone-main">
        <p><span>向</span><span class="drop-zone-emphasis">此处</span><span>拖入</span><span class="drop-zone-emphasis">文件</span><span>点</span><span>选择</span></p>
        <input id="file-input" type="file" multiple>
      </div>
      <button id="paste-file-btn" type="button" title="点击粘贴剪贴板文件"><span class="paste-file-label"><span class="paste-file-icon">📋</span><br>粘贴</span></button>
    </div>
    <p id="uploader-status" role="status">请选择要上传的文件</p>
    <div id="file-list"></div>
    <div id="uploader-error-actions" hidden>
      <button id="uploader-login" class="btn" type="button">打开智慧课程平台登录页</button>
      <button id="uploader-retry" class="btn" type="button">重试上传</button>
    </div>
  </main>
  <script src="upload-common.js"></script>
  <script src="index.js"></script>
</body>
</html>
