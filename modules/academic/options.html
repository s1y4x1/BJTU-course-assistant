<!doctype html>
<html lang="zh-CN">
<head>
  <script src="../../UI/options-message.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>教务系统选项</title>
  <script src="../../UI/theme.js"></script>
  <script src="../../UI/file-size-emphasis.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="../../UI/file-size-emphasis.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="module-options-standalone" data-options-module="academic">
<section id="academic-system-section" class="academic-options-card" data-options-fragment>
  <div class="section-title">
    <a class="module-options-page-link" data-module-options-link="academic" href="options.html"
      title="在当前页面打开教务系统选项">教务系统</a>
  </div>
  <label class="academic-option-check">
    <input type="checkbox" id="academicFullscreenButtonEnabled">在扩展全屏页面上显示「教务系统」按钮
  </label>
  <div id="academicFullscreenButtonIconOption" class="academic-fullscreen-button-icon-option">
    <label for="academicFullscreenButtonIcon">按钮图标</label>
    <select id="academicFullscreenButtonIcon" class="academic-fullscreen-button-icon-select">
      <option value="graduation">毕业帽（默认）</option>
      <option value="system">教务系统图标（MIS）</option>
    </select>
  </div>
  <label class="academic-option-check academic-wide-option">
    <input type="checkbox" id="academicOptionsWideEnabled" checked>宽屏时占满宽度
  </label>
  <div class="academic-external-script-header">
    <strong>外部脚本</strong>
    <span class="tip">从 GreasyFork 下载，需要网络通畅连接到「互联网」。</span>
  </div>
  <div id="academicExternalScriptList" class="academic-external-script-list">
    <div class="academic-external-script-item" data-script-id="assessment-satisfied">
      <label class="academic-external-script-choice">
        <input id="academicAssessmentScriptEnabled" type="checkbox" disabled>
        <span class="academic-external-script-name">BJTU 北京交通大学 一键评教为“非常满意”并填写主观意见</span>
        <span id="academicAssessmentScriptSize" class="academic-external-script-size file-size-emphasis"></span>
      </label>
      <span id="academicAssessmentScriptStatus" class="academic-external-script-status">正在检查…</span>
      <button id="academicAssessmentScriptDownload" type="button" class="academic-external-script-action" disabled>下载</button>
      <button id="academicAssessmentScriptCheckUpdate" type="button" class="academic-external-script-action" hidden disabled>检查更新</button>
      <button id="academicAssessmentScriptDelete" type="button" class="academic-external-script-action academic-external-script-delete" hidden disabled>删除</button>
      <div id="academicAssessmentScriptProgress" class="academic-external-script-progress" hidden>
        <div class="academic-external-script-progress-label">正在下载…</div>
        <div class="academic-external-script-progress-track">
          <div id="academicAssessmentScriptProgressBar" class="academic-external-script-progress-bar"></div>
        </div>
      </div>
    </div>
    <div class="academic-external-script-item" data-script-id="bb-course-availability">
      <label class="academic-external-script-choice">
        <input id="academicBbScriptEnabled" type="checkbox" disabled>
        <span class="academic-external-script-name">BB酱帮你查课余量 (2026修复版)</span>
        <span id="academicBbScriptSize" class="academic-external-script-size file-size-emphasis"></span>
      </label>
      <span id="academicBbScriptStatus" class="academic-external-script-status">正在检查…</span>
      <button id="academicBbScriptDownload" type="button" class="academic-external-script-action" disabled>下载</button>
      <button id="academicBbScriptCheckUpdate" type="button" class="academic-external-script-action" hidden disabled>检查更新</button>
      <button id="academicBbScriptDelete" type="button" class="academic-external-script-action academic-external-script-delete" hidden disabled>删除</button>
      <div class="academic-external-script-config">
        <label for="academicBbWishListCourses">愿望课程</label>
        <textarea id="academicBbWishListCourses" rows="3" spellcheck="false" placeholder="每行一个「课程号 序号」
如：A121078B 01"></textarea>
        <label for="academicBbRefreshDelayMs">刷新间隔(㎳)</label>
        <input id="academicBbRefreshDelayMs" type="number" min="500" max="3600000" step="100" value="3000">
      </div>
      <div id="academicBbScriptProgress" class="academic-external-script-progress" hidden>
        <div class="academic-external-script-progress-label">正在下载…</div>
        <div class="academic-external-script-progress-track">
          <div id="academicBbScriptProgressBar" class="academic-external-script-progress-bar"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="option-divider" role="separator"></div>
  <label class="academic-option-check">
    <input type="checkbox" id="academicScoreMonitorEnabled" checked>监控本学期成绩并通知
  </label>
  <label class="academic-option-check">
    <input type="checkbox" id="academicExamMonitorEnabled" checked>监控考试信息并通知
  </label>
  <label class="academic-option-check">
    <input type="checkbox" id="academicClassReminderEnabled">上课前通知
  </label>
  <div id="academicClassReminderLeadEditor" class="schedule-interval-editor">
    <span>提前时间</span>
    <input type="number" id="academicClassReminderLeadValue" min="1" step="1" value="10"
      aria-label="上课前通知提前时间">
    <select id="academicClassReminderLeadUnit" aria-label="上课前通知提前时间单位">
      <option value="1" selected>分钟</option>
      <option value="60">小时</option>
      <option value="1440">天</option>
    </select>
  </div>
  <div id="academicScoreMonitorIntervalEditor" class="schedule-interval-editor">
    <span>成绩与考试检查间隔</span>
    <input type="number" id="academicScoreMonitorIntervalValue" min="1" step="1" value="1"
      aria-label="教务信息检查间隔">
    <select id="academicScoreMonitorIntervalUnit" aria-label="教务信息检查间隔单位">
      <option value="1" selected>分钟</option>
      <option value="60">小时</option>
      <option value="1440">天</option>
    </select>
  </div>
  <a class="module-functional-page-link" data-module-page-link="academic" href="/modules/academic/page.html">打开教务系统</a>
</section>
<div id="msg"></div>
<script src="../../core/module-registry.js"></script>
<script src="../../UI/deadline-countdown.js"></script>
<script src="../../core/loaders/updater-loader.js"></script>
<script src="cache-store.js"></script>
<script src="score-statistics.js"></script>
<script src="options.js"></script>
<script src="../../core/option-tips.js"></script>
<script src="../../core/loaders/module-options-standalone.js"></script>
</body>
</html>
