<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 助手</title>
  <script src="../../UI/theme.js"></script>
  <script src="../../UI/file-size-emphasis.js"></script>
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="../../UI/toast.css">
  <link rel="stylesheet" href="../../UI/file-size-emphasis.css">
  <link rel="stylesheet" href="../../UI/markdown.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="../api/operations-ui.css">
  <link rel="stylesheet" href="chat.css">
</head>
<body class="llm-chat-standalone">
  <div id="llm-chat-panel" class="llm-chat-panel">
    <div class="llm-chat-header">
      <span class="llm-chat-title">AI 助手</span>
      <select id="llm-chat-model" class="llm-chat-model" title="选择模型"></select>
      <input id="llm-chat-id" class="bjtu-text-input llm-chat-id" type="text" placeholder="chat_id" aria-label="chat_id" title="输入 chat_id，按回车或移开焦点切换会话" autocomplete="off" spellcheck="false">
      <span id="llm-chat-status" class="llm-chat-status"></span>
      <button id="llm-chat-new" class="llm-chat-new" type="button" title="新建会话" aria-label="新建会话">＋</button>
      <button id="llm-chat-close" class="llm-chat-close" type="button" aria-label="关闭窗口" title="关闭窗口">×</button>
    </div>
    <div id="llm-chat-history-loading" class="llm-chat-history-loading" hidden>
      <span class="llm-chat-spinner"></span>
      <span>正在加载历史记录…</span>
    </div>
    <div class="llm-chat-messages-wrap">
      <div id="llm-chat-messages-scroll" class="llm-chat-messages-scroll">
        <div id="llm-chat-messages" class="llm-chat-messages"></div>
      </div>
      <button id="llm-chat-scroll-bottom" class="llm-chat-scroll-bottom" type="button" title="滚动到底部" aria-label="滚动到底部" hidden>↓</button>
    </div>
    <div id="llm-chat-login-hint" class="llm-chat-login-hint" hidden>
      <span>尚未登录 chat.qwen.ai</span>
      <button id="llm-chat-login-btn" class="btn llm-chat-login-btn" type="button">打开登录页</button>
    </div>
    <div id="llm-chat-ask" class="llm-chat-ask" hidden>
      <div id="llm-chat-ask-text" class="llm-chat-ask-text"></div>
      <div class="llm-chat-ask-row">
        <input id="llm-chat-ask-count" class="llm-chat-ask-count" type="number" min="1" step="1" value="3">
        <button id="llm-chat-ask-continue" class="btn llm-chat-ask-btn" type="button">继续 3 次</button>
        <button id="llm-chat-ask-always" class="btn llm-chat-ask-btn" type="button">始终允许</button>
        <button id="llm-chat-ask-session" class="btn llm-chat-ask-btn" type="button" hidden>在本次会话中始终允许</button>
        <button id="llm-chat-ask-operations" class="btn llm-chat-ask-btn" type="button" hidden>在所有会话中始终允许</button>
        <button id="llm-chat-ask-stop" class="btn llm-chat-ask-btn llm-chat-ask-stop" type="button">结束本次</button>
      </div>
    </div>
    <form id="llm-chat-input-form" class="llm-chat-input-row">
      <textarea id="llm-chat-input" class="llm-chat-input" rows="1" placeholder="向 AI 提问，例如：我还有哪些作业没交？"></textarea>
      <span class="llm-chat-input-actions">
        <span class="llm-chat-ops-toggle-wrap">
          <button id="llm-chat-ops-toggle" class="llm-chat-ops-toggle" type="button" title="允许 AI 调用以下操作">操作</button>
          <div id="llm-chat-ops-popover" class="llm-chat-ops-popover" hidden>
            <div data-operation-ui-mount></div>
          </div>
        </span>
        <label class="llm-chat-thinking-toggle">
          <input type="checkbox" id="llm-chat-thinking">
          <span>思考</span>
        </label>
        <span class="llm-chat-input-buttons">
          <button id="llm-chat-stop" class="btn llm-chat-stop" type="button" hidden>停止</button>
          <button id="llm-chat-send" class="btn llm-chat-send" type="submit">发送</button>
        </span>
      </span>
    </form>
  </div>
  <script src="../../core/module-registry.js"></script>
  <script src="../../core/loaders/api-loader.js"></script>
  <script src="../../UI/marked.umd.js"></script>
  <script src="../../UI/markdown.js"></script>
  <script src="../api/operations-ui.js"></script>
  <script src="local-model.js"></script>
  <script src="model-info.js"></script>
  <script src="composer.js"></script>
  <script src="app.js"></script>
</body>
</html>
