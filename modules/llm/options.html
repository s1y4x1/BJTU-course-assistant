<!doctype html>
<html lang="zh-CN">
<head>
  <script src="../../UI/options-message.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI 助手选项</title>
  <script src="../../UI/theme.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="module-options-standalone" data-options-module="llm">
<section class="qwen-options-card" data-options-fragment>
  <div class="section-title">
    <a class="module-options-page-link" data-module-options-link="llm" href="options.html"
      title="在当前页面打开AI 助手选项">AI 助手</a>
  </div>

  <div class="qwen-toggle-row">
    <label class="qwen-toggle">
      <input type="checkbox" id="qwenEnabled">
      <span class="qwen-toggle-label">在扩展全屏页面上显示「AI 助手」按钮</span>
    </label>
  </div>

  <div id="qwenFabColorOption" class="qwen-fab-color-option">
    <span class="qwen-setting-label">按钮颜色</span>
    <span id="qwenFabColorMode" class="theme-mode-btns qwen-fab-color-modes">
      <button class="theme-mode-btn theme-mode-btn--text" type="button" data-value="extension" title="跟随扩展">跟随扩展</button>
      <button class="theme-mode-btn theme-mode-btn--text" type="button" data-value="system" title="跟随系统">跟随系统</button>
      <button class="theme-mode-btn" type="button" data-value="light" title="浅色">☀️</button>
      <button class="theme-mode-btn" type="button" data-value="dark" title="深色">🌙</button>
    </span>
  </div>

  <div class="qwen-sub-options">
    <div class="qwen-setting-row">
      <label class="qwen-setting-label" for="qwenProvider">模型来源</label>
      <select id="qwenProvider">
        <option value="qwen">qwen.ai</option>
        <option value="local">浏览器本地模型（Prompt API）</option>
        <option value="openai">OpenAI-compatible API（Ollama / Agnes AI / 自定义）</option>
      </select>
    </div>
    <div id="llmApiOptions" hidden>
      <div class="qwen-setting-row"><label for="llmApiPreset">服务预设</label><select id="llmApiPreset"><option value="ollama">Ollama</option><option value="agnes">Agnes AI</option><option value="custom">自定义</option></select></div>
      <div class="qwen-setting-row"><label for="llmApiBaseUrl">API 基础地址</label><input id="llmApiBaseUrl" type="url" placeholder="http://127.0.0.1:11434/v1" autocomplete="off"></div>
      <div class="qwen-setting-row"><label for="llmApiKey">API Key</label><input id="llmApiKey" type="password" autocomplete="new-password" placeholder="本机 Ollama 可留空"></div>
      <div class="qwen-setting-row"><label for="llmApiModel">模型 ID</label><input id="llmApiModel" type="text" placeholder="可从下方列表选择，也可直接填写" autocomplete="off"><button id="llmRefreshModels" class="btn" type="button">刷新模型</button></div>
      <div class="tip">支持 /models 和 /chat/completions。密钥仅保存在本机扩展设置中；请求直接发送到填写的服务地址。模型能力及费用由服务商决定。更换地址后会开始新会话并清除旧服务的密钥。</div>
    </div>
    <div id="qwenLocalModelOptions" hidden>
      <div class="qwen-setting-row"><button type="button" id="qwenPrepareLocalModel" class="btn">准备本地模型</button><button type="button" id="qwenLocalModelSettings" class="btn" title="在实验设置中搜索 Prompt API，设为 Enabled 并重启浏览器">打开 Prompt API 设置</button><span id="qwenLocalModelStatus" role="status"></span></div>
      <div class="tip">首次使用由浏览器下载模型，之后在本机生成回复，不登录或发送对话到 qwen.ai。需浏览器启用 Prompt API 且设备满足要求；中文和操作调用能力取决于浏览器模型。不支持独立思考开关。</div>
    </div>
    <div class="qwen-setting-row">
      <label class="qwen-setting-label" for="qwenModelSelect">模型</label>
      <select id="qwenModelSelect" class="qwen-model-select" disabled>
        <option value="">加载模型中…</option>
      </select>
    </div>

    <div class="qwen-toggle-row">
      <label class="qwen-toggle">
        <input type="checkbox" id="qwenThinkingEnabled">
        <span class="qwen-toggle-label">回答前让模型思考</span>
      </label>
    </div>

    <div class="qwen-setting-row">
      <label class="qwen-setting-label" for="qwenMaxIterations">操作循环上限</label>
      <input type="number" id="qwenMaxIterations" class="qwen-model-select bjtu-content-sized-input" min="1" step="1"><span>次</span>
      <div class="tip">AI 连续调用操作达到该次数后，会询问是否继续（发送新消息时生效）。</div>
    </div>

    <div class="qwen-toggle-row">
      <label class="qwen-toggle">
        <input type="checkbox" id="qwenAlwaysAllow">
        <span class="qwen-toggle-label">始终允许 AI 循环调用操作（忽略次数限制）</span>
      </label>
    </div>

    <div class="qwen-setting-row">
      <label class="qwen-setting-label" for="qwenApprovalNotificationMode">操作需要批准时</label>
      <select id="qwenApprovalNotificationMode" class="qwen-model-select qwen-notification-mode">
        <option value="always">总是</option>
        <option value="background" selected>若处于后台</option>
        <option value="never">不</option>
      </select>
      <span class="qwen-setting-label">发送系统通知</span>
    </div>

    <div class="qwen-setting-row">
      <label class="qwen-setting-label" for="qwenCompletionNotificationMode">回复生成完毕后</label>
      <select id="qwenCompletionNotificationMode" class="qwen-model-select qwen-notification-mode">
        <option value="always">总是</option>
        <option value="background" selected>若处于后台</option>
        <option value="never">不</option>
      </select>
      <span class="qwen-setting-label">发送系统通知</span>
    </div>

    <div class="qwen-toggle-row">
      <a id="qwenOpenChatStandalone" class="btn" style="text-decoration:none;">打开AI 助手</a>
    </div>

  </div>
</section>

<div id="msg"></div>

<script src="../../core/storage-utils.js"></script>
<script src="../../core/option-tips.js"></script>
<script src="../../core/loaders/module-options-standalone.js"></script>
<script src="options.js"></script>
</body>
</html>
