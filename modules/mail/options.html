<!doctype html>
<html lang="zh-CN">
<head>
  <script src="../../UI/options-message.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BJTU 邮件系统选项</title>
  <script src="../../UI/theme.js"></script>
  <script src="../../UI/file-size-emphasis.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="../../UI/file-size-emphasis.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="module-options-standalone" data-options-module="mail">
<section id="mail-system-section" class="mail-options-card" data-options-fragment>
  <div class="section-title">
    <a class="module-options-page-link" data-module-options-link="mail" href="options.html"
      title="在当前页面打开 BJTU 邮件系统选项">BJTU 邮件系统</a>
  </div>
  <label class="mail-option-check">
    <input type="checkbox" id="mailFullscreenButtonEnabled">在扩展全屏页面上显示「BJTU 邮件系统」按钮
  </label>
  <div id="mailFullscreenButtonIconOption" class="mail-fullscreen-button-icon-option">
    <label for="mailFullscreenButtonIcon">按钮图标</label>
    <select id="mailFullscreenButtonIcon" class="mail-fullscreen-button-icon-select">
      <option value="envelope">信封（默认）</option>
      <option value="system">邮箱网站图标</option>
    </select>
  </div>
  <label class="mail-option-check">
    <input type="checkbox" id="mailMonitorEnabled">监控收件箱并通知
  </label>
  <div class="tip">检测时会按「统一身份认证」中的平台选择，使用已保存的账号密码恢复登录，再通过 MIS 登录邮箱；首次检测仅建立基线，已读的新邮件不会发送通知。</div>
  <div id="mailMonitorIntervalEditor" class="schedule-interval-editor">
    <span>检查间隔</span>
    <input type="number" id="mailMonitorIntervalValue" min="1" step="1" value="10"
      aria-label="邮件检查间隔">
    <select id="mailMonitorIntervalUnit" aria-label="邮件检查间隔单位">
      <option value="1" selected>分钟</option>
      <option value="60">小时</option>
      <option value="1440">天</option>
    </select>
  </div>
  <a class="module-functional-page-link" data-module-page-link="mail" href="/modules/mail/page.html">打开 BJTU 邮件系统</a>
</section>
<div id="msg"></div>
<script src="options.js"></script>
<script src="../../core/option-tips.js"></script>
<script src="../../core/loaders/module-options-standalone.js"></script>
</body>
</html>
