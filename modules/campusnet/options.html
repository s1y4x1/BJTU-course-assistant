<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>校园网自动重连选项</title>
  <script src="../../UI/theme.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="module-options-standalone" data-options-module="campusnet">
<section class="campusnet-options-card" data-options-fragment>
  <div class="section-title">
    <a class="module-options-page-link" data-module-options-link="campusnet" href="options.html"
      title="在当前页面打开校园网自动重连选项">校园网自动重连</a>
  </div>
  <label class="campusnet-option-check">
    <input type="checkbox" id="campusNetworkReconnectEnabled">
    每隔一段时间请求校园网认证接口
  </label>
  <div id="campusNetworkReconnectDetail" class="campusnet-options-detail">
    <label for="campusNetworkReconnectAccount">上网账号</label>
    <input id="campusNetworkReconnectAccount" type="text" autocomplete="username" placeholder="默认使用学号">
    <label for="campusNetworkReconnectPassword">上网密码</label>
    <input id="campusNetworkReconnectPassword" type="password" autocomplete="current-password"
      placeholder="校园网密码，通常是大小写字母、特殊字符、数字">
    <div id="campusNetworkReconnectIntervalEditor" class="campusnet-interval-editor">
      <span>请求间隔</span>
      <input type="number" id="campusNetworkReconnectIntervalValue" min="0.1" step="0.1" value="1"
        aria-label="校园网重连请求间隔">
      <select id="campusNetworkReconnectIntervalUnit" aria-label="校园网重连请求间隔单位">
        <option value="1" selected>秒</option>
        <option value="60">分钟</option>
        <option value="3600">小时</option>
      </select>
    </div>
    <label class="campusnet-option-check">
      <input type="checkbox" id="campusNetworkReconnectNotifyOnSuccess" checked>
      重连成功时发送系统通知
    </label>
    <div class="tip">遇到 503 会忽略并按间隔重试；即使已经在线也会继续请求。</div>
    <div id="campusNetworkReconnectStatus" class="option-status campusnet-status">校园网自动重连未启用。</div>
  </div>
</section>
<div id="msg"></div>
<script src="options.js"></script>
<script src="../../core/option-tips.js"></script>
<script src="../../core/loaders/module-options-standalone.js"></script>
</body>
</html>
