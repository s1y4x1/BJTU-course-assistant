<div class="api-operation-panel" data-operation-ui-root>
  <div class="api-operation-header">
    <span class="api-operation-header-title">允许调用以下操作</span>
    <span class="api-operation-toggle-actions">
      <button type="button" class="api-operation-toggle-all" data-operation-toggle-all="enabled">反选启用</button>
      <button type="button" class="api-operation-toggle-all" data-operation-toggle-all="always">反选始终允许</button>
    </span>
  </div>
  <div class="api-operation-tip">每项第一个开关控制是否允许调用，第二个开关控制是否在所有会话中始终允许该操作。</div>
  <div class="api-operation-list" data-operation-list role="group" aria-label="可调用的操作"></div>
</div>
