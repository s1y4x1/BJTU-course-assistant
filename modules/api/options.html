<!doctype html>
<html lang="zh-CN">
<head>
  <script src="../../UI/options-message.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>扩展接口选项</title>
  <script src="../../UI/theme.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="operations-ui.css">
</head>
<body class="module-options-standalone" data-options-module="api">
<section class="api-options-card" data-options-fragment>
  <div class="section-title">
    <a class="module-options-page-link" data-module-options-link="api" href="options.html"
      title="在当前页面打开扩展接口选项">扩展接口</a>
  </div>
  <p class="api-console-hint">在扩展页面的开发者工具控制台中可直接调用操作，例如 <code>ve.login()</code>。
    使用 <code>api.operationList()</code> 获取操作列表、<code>api.getDocs()</code> 查询说明。</p>
  <p><a class="option-action-link" href="/modules/api/run.html">打开命令控制台</a></p>
  <div data-operation-ui-mount></div>
  <div class="option-divider"></div>
  <label class="api-startup-toggle"><input id="apiStartupEnabled" type="checkbox" disabled><span>启动时执行 JS 代码</span></label>
  <div class="tip">每次打开 app.html，页面初始化完成后在 app 环境执行一次；可使用 dom 和扩展接口。保存修改不会立即执行。</div>
  <textarea id="apiStartupCode" class="api-code-editor" rows="7" aria-label="启动时执行的 JavaScript 代码" placeholder="例如：await dom.set('#username-input', 'title', '账号');" spellcheck="false" disabled></textarea>
  <div id="apiStartupStatus" class="api-startup-status" role="status">正在读取…</div>
  <div class="option-divider"></div>
  <div class="api-history-heading"><h3>执行历史</h3><button id="apiExecutionHistoryClear" class="api-history-delete" type="button">清空历史</button></div>
  <div class="tip">llmExecutionHistory：最近 20 条执行代码和结果。</div>
  <div id="apiExecutionHistory"></div>
</section>

<div id="msg" role="status" aria-live="polite"></div>

<script src="../../core/module-registry.js"></script>
<script src="../../core/loaders/api-loader.js"></script>
<script src="operations-ui.js"></script>
<script src="options.js"></script>
</body>
</html>
