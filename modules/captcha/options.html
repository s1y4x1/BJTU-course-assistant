<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地验证码识别选项</title>
  <script src="../../UI/theme.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="module-options-standalone" data-options-module="captcha">
<section class="captcha-options-card" data-options-fragment>
  <div class="section-title">
    <a class="module-options-page-link" data-module-options-link="captcha" href="options.html"
      title="在当前页面打开本地验证码识别选项">本地验证码识别</a>
  </div>
  <div id="captcha-model-label" class="captcha-model-label">Tesseract 模型版本</div>
  <div id="captchaModelList" class="captcha-model-list" role="radiogroup" aria-label="验证码识别模型版本">
    <div class="captcha-model-loading"><span class="options-page-spinner"></span>正在获取模型列表…</div>
  </div>
  <div class="captcha-core-status">
    <span class="captcha-core-file">
      <span class="captcha-core-name">tesseract-core-simd.wasm.js</span>
      <span id="captchaCoreSize" class="captcha-model-size">4.52 MB</span>
    </span>
    <span id="captchaCoreStatusValue">正在检查…</span>
    <div id="captchaCoreProgress" class="captcha-core-progress" hidden>
      <div class="captcha-core-progress-track">
        <div id="captchaCoreProgressBar" class="captcha-core-progress-bar"></div>
      </div>
    </div>
  </div>
  <div class="tip" data-tip-target="#captcha-model-label">模型下载后保存在 IndexedDB，只有已下载的模型可以选用；OCR 核心仍需写入扩展安装目录。</div>
  <div class="option-divider" role="separator"></div>
  <div class="mis-captcha-section">
    <div class="mis-captcha-toggle-row">
      <label class="mis-captcha-toggle">
        <input type="checkbox" id="casCaptchaRecognitionEnabled">
        <span class="mis-captcha-toggle-label">自动识别填充 CAS 验证码</span>
      </label>
    </div>
    <div class="captcha-core-status mis-captcha-status mis-captcha-group">
      <span class="captcha-core-file">
        <span class="captcha-core-name">bjtu-mis-helper</span>
      </span>
      <span class="mis-captcha-status-right">
        <span id="casCaptchaStatusValue">正在检查…</span>
        <button type="button" id="casCaptchaDownload" class="captcha-model-action" data-mode="download" hidden>下载</button>
        <button type="button" id="casCaptchaDelete" class="captcha-model-action" hidden>删除</button>
      </span>
      <div class="mis-captcha-files">
        <div class="captcha-core-status mis-captcha-status">
          <span class="captcha-core-file">
            <span class="captcha-core-name">omis.onnx</span>
            <span id="casCaptchaSizeOmis" class="captcha-model-size">…</span>
          </span>
          <span id="casCaptchaStatusOmis" class="mis-captcha-file-status">…</span>
          <div id="casCaptchaProgressOmis" class="captcha-core-progress" hidden>
            <div class="captcha-core-progress-track">
              <div id="casCaptchaProgressBarOmis" class="captcha-core-progress-bar"></div>
            </div>
          </div>
        </div>
        <div class="captcha-core-status mis-captcha-status">
          <span class="captcha-core-file">
            <span class="captcha-core-name">ort-wasm-simd.wasm</span>
            <span id="casCaptchaSizeWasm" class="captcha-model-size">…</span>
          </span>
          <span id="casCaptchaStatusWasm" class="mis-captcha-file-status">…</span>
          <div id="casCaptchaProgressWasm" class="captcha-core-progress" hidden>
            <div class="captcha-core-progress-track">
              <div id="casCaptchaProgressBarWasm" class="captcha-core-progress-bar"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="tip" data-tip-target=".mis-captcha-toggle-row">CAS 登录验证码为算术表达式（如 12+5=？），由本地模型识别并计算结果，无需联网。模型与 ONNX Runtime 不随扩展内置，勾选启用后如未下载将自动开始下载；删除前请先取消勾选。</div>
  </div>
</section>
<div id="msg"></div>
<script src="../../core/module-registry.js"></script>
<script src="../../core/captcha-assets.js"></script>
<script src="mis-assets.js"></script>
<script src="../../core/loaders/updater-loader.js"></script>
<script src="options.js"></script>
<script src="../../core/loaders/module-options-standalone.js"></script>
</body>
</html>
