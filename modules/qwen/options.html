<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>通义千问选项</title>
  <script src="../../UI/theme.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="options.css">
</head>
<body class="module-options-standalone" data-options-module="qwen">
<section class="qwen-options-card" data-options-fragment>
  <div class="section-title">
    <a class="module-options-page-link" data-module-options-link="qwen" href="options.html"
      target="_blank" rel="noopener noreferrer" title="在单独页面中打开通义千问选项">通义千问</a>
  </div>

  <div class="qwen-toggle-row">
    <label class="qwen-toggle">
      <input type="checkbox" id="qwenEnabled">
      <span class="qwen-toggle-label">启用通义千问智能代理</span>
    </label>
  </div>

  <div class="qwen-setting-row">
    <label class="qwen-setting-label" for="qwenModelSelect">模型</label>
    <select id="qwenModelSelect" class="qwen-model-select" disabled>
      <option value="">加载模型中…</option>
    </select>
  </div>

  <div class="qwen-toggle-row">
    <label class="qwen-toggle">
      <input type="checkbox" id="qwenThinkingEnabled">
      <span class="qwen-toggle-label">回答前让模型思考</span>
    </label>
  </div>

  <div class="qwen-setting-row">
    <span class="qwen-setting-label">允许 AI 调用以下操作</span>
    <span class="qwen-ops-actions">
      <button type="button" id="qwenOpsToggle" class="qwen-link-btn">反选</button>
    </span>
  </div>
  <div id="qwenOperationList" class="qwen-operation-list" role="group" aria-label="可调用的操作">
    <div class="qwen-operation-loading"><span class="options-page-spinner"></span>正在获取操作列表…</div>
  </div>

  <div class="tip">操作由本扩展各模块提供，AI 会在回复末尾调用操作并自动把结果继续发送给它。</div>
</section>

<script src="../../core/storage-utils.js"></script>
<script src="../../core/loaders/module-options-standalone.js"></script>
<script src="options.js"></script>
</body>
</html>
