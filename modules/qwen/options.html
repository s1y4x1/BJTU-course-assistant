<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>通义千问选项</title>
  <script src="../../UI/theme.js"></script>
  <link rel="stylesheet" href="../../options/options.css">
  <link rel="stylesheet" href="../../UI/theme.css">
  <link rel="stylesheet" href="options.css">
  <link rel="stylesheet" href="operations-ui.css">
</head>
<body class="module-options-standalone" data-options-module="qwen">
<section class="qwen-options-card" data-options-fragment>
  <div class="section-title">
    <a class="module-options-page-link" data-module-options-link="qwen" href="options.html"
      title="在当前页面打开通义千问选项">通义千问</a>
  </div>

  <div class="qwen-toggle-row">
    <label class="qwen-toggle">
      <input type="checkbox" id="qwenEnabled">
      <span class="qwen-toggle-label">在扩展全屏页面上显示「千问助手」按钮</span>
    </label>
  </div>

  <div id="qwenFabColorOption" class="qwen-fab-color-option">
    <span class="qwen-setting-label">按钮颜色</span>
    <span id="qwenFabColorMode" class="theme-mode-btns qwen-fab-color-modes">
      <button class="theme-mode-btn theme-mode-btn--text" type="button" data-value="extension" title="跟随扩展">跟随扩展</button>
      <button class="theme-mode-btn theme-mode-btn--text" type="button" data-value="system" title="跟随系统">跟随系统</button>
      <button class="theme-mode-btn" type="button" data-value="light" title="浅色">☀️</button>
      <button class="theme-mode-btn" type="button" data-value="dark" title="深色">🌙</button>
    </span>
  </div>

  <div class="qwen-toggle-row">
    <a id="qwenOpenChatStandalone" class="btn" style="text-decoration:none;" target="_blank"
      rel="noopener noreferrer">在独立窗口打开千问助手</a>
  </div>

  <div class="qwen-sub-options">
    <div class="qwen-setting-row">
      <label class="qwen-setting-label" for="qwenModelSelect">模型</label>
      <select id="qwenModelSelect" class="qwen-model-select" disabled>
        <option value="">加载模型中…</option>
      </select>
    </div>

    <div class="qwen-toggle-row">
      <label class="qwen-toggle">
        <input type="checkbox" id="qwenThinkingEnabled">
        <span class="qwen-toggle-label">回答前让模型思考</span>
      </label>
    </div>

    <div class="qwen-setting-row">
      <label class="qwen-setting-label" for="qwenMaxIterations">操作循环上限</label>
      <input type="number" id="qwenMaxIterations" class="qwen-model-select" min="1" step="1">
      <div class="tip">AI 连续调用操作达到该次数后，会询问是否继续（发送新消息时生效）。</div>
    </div>

    <div class="qwen-toggle-row">
      <label class="qwen-toggle">
        <input type="checkbox" id="qwenAlwaysAllow">
        <span class="qwen-toggle-label">始终允许 AI 循环调用操作（忽略次数限制）</span>
      </label>
    </div>

    <div data-operation-ui-mount></div>
  </div>
</section>

<script src="../../core/storage-utils.js"></script>
<script src="../../core/option-tips.js"></script>
<script src="../../core/loaders/module-options-standalone.js"></script>
<script src="operations-ui.js"></script>
<script src="options.js"></script>
</body>
</html>
