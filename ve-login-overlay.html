<div id="__bjtu_portal_login_mask__">
  <div id="__bjtu_portal_login_card__">
    <div class="__bjtu_portal_header">
      <div>
        <div class="__bjtu_portal_title">课程助手登录</div>
        <div class="__bjtu_portal_subtitle">一体化智慧教学平台</div>
      </div>
      <button id="__bjtu_portal_close__" class="__bjtu_portal_close" type="button" title="关闭" aria-label="关闭">×</button>
    </div>
    <div id="__bjtu_portal_status__">正在读取账号信息…</div>
    <div class="__bjtu_portal_search">
      <label class="__bjtu_portal_field">
        <span class="__bjtu_portal_label">账号</span>
        <input id="__bjtu_portal_username__" class="__bjtu_portal_input" placeholder="输入账号搜索" autocomplete="username">
      </label>
      <label class="__bjtu_portal_field">
        <span class="__bjtu_portal_label">姓名</span>
        <input id="__bjtu_portal_name__" class="__bjtu_portal_input" placeholder="输入姓名搜索">
      </label>
    </div>
    <div class="__bjtu_portal_sections">
      <section class="__bjtu_portal_section">
        <div class="__bjtu_portal_section_header">
          <span class="__bjtu_portal_section_title">账号搜索结果</span>
          <span id="__bjtu_portal_result_count__" class="__bjtu_portal_section_hint"></span>
        </div>
        <div id="__bjtu_portal_results__" class="__bjtu_portal_list"><div class="__bjtu_portal_empty">输入账号或姓名开始搜索</div></div>
      </section>
      <section class="__bjtu_portal_section">
        <div class="__bjtu_portal_section_header">
          <span class="__bjtu_portal_section_title">最近登录账号</span>
          <span class="__bjtu_portal_section_hint">点击账号直接登录</span>
        </div>
        <div id="__bjtu_portal_history__" class="__bjtu_portal_list"></div>
      </section>
    </div>
    <div id="__bjtu_portal_manual_password__">
      <div class="__bjtu_portal_password_grid">
        <label class="__bjtu_portal_field">
          <span class="__bjtu_portal_label">密码明文</span>
          <input id="__bjtu_portal_password_plain__" class="__bjtu_portal_input" type="text" placeholder="请输入密码">
        </label>
        <button id="__bjtu_portal_default__" class="__bjtu_portal_default" type="button">填入默认密码</button>
        <label class="__bjtu_portal_field">
          <span class="__bjtu_portal_label">加密密码</span>
          <input id="__bjtu_portal_password_md5__" class="__bjtu_portal_input" type="text" maxlength="256" placeholder="根据明文自动计算，也可单独输入">
        </label>
      </div>
    </div>
  </div>
  <div id="__bjtu_portal_recovery_mask__">
    <div class="__bjtu_portal_recovery_card">
      <div class="__bjtu_portal_recovery_header">
        <div class="__bjtu_portal_recovery_title">账号或密码错误</div>
      </div>
      <div id="__bjtu_portal_recovery_message__" class="__bjtu_portal_recovery_message"></div>
      <div id="__bjtu_portal_recovery_choice__" class="__bjtu_portal_recovery_actions">
        <button id="__bjtu_portal_recovery_reinitialize__" type="button">重新初始化账号列表</button>
        <button id="__bjtu_portal_recovery_manual_btn__" type="button">手动输入密码</button>
        <button id="__bjtu_portal_recovery_cancel__" type="button">取消</button>
      </div>
      <div id="__bjtu_portal_recovery_manual__" style="display:none;">
        <div class="__bjtu_portal_recovery_password_row">
          <input id="__bjtu_portal_recovery_plain__" type="text" autocomplete="current-password" placeholder="密码明文">
          <button id="__bjtu_portal_recovery_default__" type="button">填入默认密码</button>
        </div>
        <input id="__bjtu_portal_recovery_md5__" type="text" maxlength="256" spellcheck="false" placeholder="加密密码（根据明文自动计算，也可单独输入）">
        <div class="__bjtu_portal_recovery_actions">
          <button id="__bjtu_portal_recovery_submit__" type="button">登录</button>
          <button id="__bjtu_portal_recovery_manual_cancel__" type="button">取消</button>
        </div>
      </div>
    </div>
  </div>
</div>
