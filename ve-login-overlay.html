<style>

  #__bjtu_portal_recovery_plain__,#__bjtu_portal_recovery_md5__{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font:14px/1.4 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;outline:none}

<div id="__bjtu_portal_login_mask__">
