<!DOCTYPE html>
<html lang="zh-CN" class="app-options-loading">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BJTU 课程助手</title>
    <script src="../UI/theme.js"></script>
    <script src="../UI/file-size-emphasis.js"></script>
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="../UI/file-size-emphasis.css">
    <link rel="stylesheet" href="../uploads/duplicate-dialog.css">
    <script src="../core/popup-style-bridge.js"></script>
    <link rel="stylesheet" href="../UI/theme.css">
</head>

<body>
    <div id="toast-container"></div>

    <div class="page-top-config">
        <div class="top-inline-controls">
            <div id="version-info" class="version-info">
                <button id="version-btn" type="button" class="version-btn" disabled style="display:none"></button>
            </div>
            <input type="text" id="username-input" value="" placeholder="账号" title="账号"
                style="width: 72px; min-width: 72px; padding: 5px;">
            <select id="account-history-select" title="已登录账号" style="padding: 5px;"></select>
            <select id="xq-select" title="学期选择" style="padding:5px;margin-left:6px;min-width:160px;"></select>

            <input type="text" id="jsessionid-input" placeholder="JSESSIONID" title="JSESSIONID"
                style="flex: 1; padding: 5px;">
            <div class="popup-window-actions">
                <button id="popup-open-fullscreen" class="btn popup-fullscreen-btn" type="button" title="打开完整扩展">⧉
                    全屏</button>
                <button id="open-options-btn" class="btn" type="button" title="设置">⚙️</button>
            </div>
        </div>
    </div>

    <div class="layout-container">
        <div class="left-column">
            <div class="upload-section-header" style="display:flex; align-items:center; justify-content:space-between; margin: 0 0 10px;">
                <h1 style="margin: 0;">文件上传</h1>
                <div style="display:flex; align-items:center; gap:8px;">
                    <span class="options-controlled-slot save-uploads-options-slot">
                        <label class="save-uploads-toggle" data-options-controlled style="display:flex; align-items:center; gap:6px; font-size:12px; color:#475569; cursor:pointer;">
                            <input type="checkbox" id="save-uploads-enabled" checked>
                            <span>在本地存储以后上传的文件链接</span>
                        </label>
                        <span class="options-loading-placeholder" aria-label="正在加载扩展选项"><span class="options-loading-spinner"></span></span>
                    </span>
                    <button id="invert-save-uploads-btn" class="btn" style="background:#000; color:#fff; padding:3px 8px; font-size:11px; line-height:1.2;">反选</button>
                </div>
            </div>

            <div class="upload-summary-area">
                <div class="upload-total-progress-wrap">
                    <div class="upload-total-meta">
                        <div id="total-size-info">0 B / 0 B</div>
                        <div id="total-percent" style="display:none;">0%</div>
                        <div id="total-speed">0 KB/s</div>
                        <div id="total-eta"></div>
                    </div>
                    <div class="progress-bar-container">
                        <div id="total-server-bar" class="progress-bar"></div>
                    </div>
                </div>
                <button id="copy-all-btn" class="btn">复制选中链接</button>
            </div>

            <div id="drop-zone" style="display:flex; align-items:stretch;">
                <div style="flex:1; display:flex; align-items:center; justify-content:center; position:relative;">
                    <p style="display:inline-grid; grid-template-columns:auto auto auto auto; align-items:center; justify-items:center; text-align:center; column-gap:8px; row-gap:0;">
                        <span style="grid-row:1; grid-column:1; font-size:18px;">向</span>
                        <span style="font-size:48px; font-weight:700; font-family:楷体,仿宋,serif; grid-row:1/3; grid-column:2;">此处</span>
                        <span style="grid-row:1; grid-column:3; font-size:18px;">拖入</span>
                        <span style="font-size:48px; font-weight:700; font-family:楷体,仿宋,serif; grid-row:1/3; grid-column:4;">文件</span>
                        <span style="grid-row:2; grid-column:1; font-size:18px;">点</span>
                        <span style="grid-row:2; grid-column:3; font-size:18px;">选择</span>
                    </p>
                    <input type="file" id="file-input" multiple>
                </div>
                <div style="display:flex; align-items:center; justify-content:center; border:1px dashed #d1d5db; border-radius:6px; margin:4px; padding:8px 16px; min-width:80px; cursor:pointer;" id="paste-file-btn" title="点击粘贴剪贴板文件">
                    <span class="paste-file-label" style="font-size:18px; color:#475569; user-select:none;">📋<br>粘贴</span>
                </div>
            </div>
            <div id="saved-uploads-section"></div>

            <div id="file-list"></div>

            <div id="resource-space-section" class="resource-space-section">
                <div class="resource-space-header">
                    <span class="resource-space-title">资源空间</span>
                    <div class="resource-space-header-right">
                        <input type="text" id="resource-search-input" placeholder="搜索资源名" title="搜索资源名（回车或失焦搜索）">
                        <span id="resource-space-count" class="resource-space-count">共 0 个资源文件</span>
                        <button id="resource-select-all-btn" class="btn"
                            style="background:#000; color:#fff; padding:3px 8px; font-size:11px; line-height:1.2;">反选</button>
                    </div>
                </div>
                <div class="resource-space-footer">
                    <div class="resource-total-progress-wrap">
                        <div class="resource-total-meta">
                            <span id="resource-download-total-size">0 B / 0 B</span>
                            <span id="resource-download-total-percent" style="display:none;">0%</span>
                            <span id="resource-download-total-speed">0 KB/s</span>
                            <span id="resource-download-total-eta"></span>
                        </div>
                        <div class="progress-bar-container">
                            <div id="resource-download-total-bar" class="progress-bar"></div>
                        </div>
                    </div>
                    <div class="resource-space-actions">
                        <button id="resource-copy-selected-btn" class="btn">复制选中链接</button>
                        <button id="resource-download-selected-btn" class="btn">下载选中文件</button>
                    </div>
                </div>
                <div id="resource-space-status" class="resource-space-status">等待加载…</div>
                <div id="resource-space-list" class="resource-space-list"></div>
            </div>
        </div>

        <div class="right-column" id="right-column">
            <div class="column-resizer" id="column-resizer" title="拖动调整课程助手宽度">
                <button id="column-collapse-toggle" class="column-collapse-toggle" type="button"
                    title="折叠左栏" aria-label="折叠左栏" aria-expanded="true">◀</button>
            </div>
            <h2 class="course-header">
                <span>课程助手</span>
                <button id="course-helper-even-widths" class="course-helper-even-widths" type="button" hidden>平均分配宽度</button>
                <span class="options-controlled-slot platform-options-slot">
                <span class="platform-status-actions" data-options-controlled>
                    <span id="ve-status-btn" class="platform-status-btn checking" title="智慧课程平台加载中" data-module="ve">
                        <button type="button" class="dot" data-action="toggle-platform" data-platform="ve"
                            aria-label="切换智慧课程平台"></button>
                        <a class="platform-link" href="http://123.121.147.7:88/ve/" target="_blank"
                            rel="noopener noreferrer">智慧课程平台</a>
                    </span>
                    <span id="ykt-status-btn" class="platform-status-btn checking" title="雨课堂登录状态检测中" data-module="ykt" hidden>
                        <button type="button" class="dot" data-action="toggle-platform" data-platform="ykt"
                            aria-label="切换雨课堂"></button>
                        <a class="platform-link" href="https://www.yuketang.cn/web" target="_blank"
                            rel="noopener noreferrer">雨课堂</a>
                    </span>
                    <span id="mrjzy-status-btn" class="platform-status-btn checking" title="每日交作业登录状态检测中" data-module="mrjzy" hidden>
                        <button type="button" class="dot" data-action="toggle-platform" data-platform="mrjzy"
                            aria-label="切换每日交作业"></button>
                        <a class="platform-link" href="https://zuoye.lulufind.com/" target="_blank"
                            rel="noopener noreferrer">每日交作业</a>
                    </span>
                    <span id="jlgj-status-btn" class="platform-status-btn checking" title="接龙管家登录状态检测中" data-module="jlgj" hidden>
                        <button type="button" class="dot" data-action="toggle-platform" data-platform="jlgj"
                            aria-label="切换接龙管家"></button>
                        <a class="platform-link" href="https://i.jielong.com/my-class" target="_blank"
                            rel="noopener noreferrer">接龙管家</a>
                    </span>
                    <span id="mooc-status-btn" class="platform-status-btn checking" title="中国大学MOOC登录状态检测中" data-module="mooc" hidden>
                        <button type="button" class="dot" data-action="toggle-platform" data-platform="mooc"
                            aria-label="切换中国大学MOOC"></button>
                        <a class="platform-link" href="https://www.icourse163.org/" target="_blank"
                            rel="noopener noreferrer">中国大学MOOC</a>
                    </span>
                    <span id="xuetangx-status-btn" class="platform-status-btn checking" title="学堂在线登录状态检测中" data-module="xuetangx" hidden>
                        <button type="button" class="dot" data-action="toggle-platform" data-platform="xuetangx"
                            aria-label="切换学堂在线"></button>
                        <a class="platform-link" href="https://www.xuetangx.com/" target="_blank"
                            rel="noopener noreferrer">学堂在线</a>
                    </span>
                </span>
                <span class="options-loading-placeholder" aria-label="正在加载平台选项"><span class="options-loading-spinner"></span></span>
                </span>
            </h2>
            <div class="course-list-stage">
                <div id="course-list"></div>
                <div id="course-list-transition-placeholder" class="course-list-transition-placeholder" aria-live="polite">
                    <span class="spinner" aria-hidden="true"></span>
                    <span>正在处理…</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div id="login-modal"
        style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.45); z-index: 1000;">
        <div class="login-panel">
            <button id="login-modal-close" class="btn modal-close-btn" type="button"
                aria-label="关闭" title="关闭">×</button>
            <h3 id="login-modal-title">登录</h3>
            <p id="login-welcome-msg"
                style="color: #4CAF50; font-weight: bold; margin-bottom: 10px; min-height: 1.2em;"></p>
            <p id="login-instruction" style="margin: 10px 0;">请输入账号登录</p>

            <button id="login-btn" class="btn">登录</button>
            <button id="cancel-btn" class="btn"
                style="position:absolute; top:50px; right:8px; background-color:#64748b; padding:2px 8px; font-size:12px; line-height:1.3; display:none;">取消</button>
        </div>
    </div>

    <div id="account-init-modal" class="version-modal-mask" style="display:none;">
        <div class="version-modal-card account-init-card">
            <div class="version-modal-header">
                <div id="account-init-title" class="version-download-title">初始化登录账号列表</div>
            </div>
            <div id="account-init-status" class="account-init-status">正在准备…</div>
            <div id="account-init-fetch-options" class="account-init-fetch-options" style="display:none;">
                <label><input id="account-init-fetch-teachers" type="checkbox" checked><span>获取教职工</span></label>
                <label><input id="account-init-fetch-students" type="checkbox" checked><span>获取学生</span></label>
            </div>
            <label id="account-init-quick-option" class="account-init-quick-option" style="display:none;">
                <input id="account-init-fetch-quick-usernames" type="checkbox">
                <span>获取账号同时请求极速登录用户名</span>
            </label>
            <div id="account-init-actions" class="account-init-actions" style="display:none;">
                <button id="account-init-remote" class="btn" type="button">从平台获取</button>
                <button id="account-init-import" class="btn" type="button">导入 JSON</button>
                <button id="account-init-skip" class="btn" type="button">跳过</button>
                <input id="account-init-file" type="file" accept=".json,application/json" hidden>
            </div>
            <div id="account-init-import-actions" class="account-init-actions account-init-import-actions" style="display:none;">
                <button id="account-init-import-local" class="btn" type="button">从本地文件导入</button>
                <button id="account-init-import-remote" class="btn" type="button">从远程仓库导入</button>
                <button id="account-init-import-back" class="btn" type="button">返回</button>
            </div>
            <div id="account-init-download-progress" class="account-init-download-progress" style="display:none;" role="progressbar" aria-label="账号列表下载进度" aria-valuemin="0" aria-valuemax="100">
                <div id="account-init-download-label" class="account-init-progress-label">下载：正在等待</div>
                <div class="progress-bar-container">
                    <div id="account-init-download-progress-bar" class="progress-bar"></div>
                </div>
            </div>
            <div class="account-init-progress-row">
                <div id="account-init-teacher-label" class="account-init-progress-label">教职工：正在等待</div>
                <div class="progress-bar-container">
                    <div id="account-init-teacher-progress-bar" class="progress-bar"></div>
                </div>
            </div>
            <div class="account-init-progress-row">
                <div id="account-init-student-label" class="account-init-progress-label">学生：正在等待</div>
                <div class="progress-bar-container">
                    <div id="account-init-student-progress-bar" class="progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="account-recovery-modal" class="version-modal-mask" style="display:none;">
        <div class="version-modal-card account-recovery-card">
            <div class="version-modal-header">
                <div class="version-download-title">账号或密码错误</div>
            </div>
            <div id="account-recovery-message" class="account-recovery-message"></div>
            <div id="account-recovery-choice" class="account-recovery-actions">
                <button id="account-recovery-reinitialize" class="btn" type="button">重新初始化账号列表</button>
                <button id="account-recovery-manual-btn" class="btn" type="button">手动输入密码</button>
                <button id="account-recovery-cancel" class="btn" type="button">取消</button>
            </div>
            <div id="account-recovery-manual" style="display:none;">
                <div class="account-recovery-password-row">
                    <input id="account-recovery-password-plain" type="text" autocomplete="current-password" placeholder="密码明文">
                    <button id="account-recovery-default" class="btn" type="button">填入默认密码</button>
                </div>
                <input id="account-recovery-password-md5" type="text" maxlength="256" spellcheck="false" placeholder="加密密码（根据明文自动计算，也可单独输入）">
                <div id="account-recovery-captcha" class="account-recovery-captcha" style="display:none;">
                    <img id="account-recovery-captcha-image" alt="验证码">
                    <input id="account-recovery-passcode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="输入 4 位验证码">
                </div>
                <div class="account-recovery-actions">
                    <button id="account-recovery-submit" class="btn" type="button">登录</button>
                    <button id="account-recovery-manual-cancel" class="btn" type="button">取消</button>
                </div>
            </div>
        </div>
    </div>

    <div id="fullscreen-module-buttons" class="fullscreen-module-buttons" hidden>
        <button id="mail-fullscreen-button" class="fullscreen-module-button mail-fullscreen-button" data-module="mail"
            type="button" title="BJTU 邮件系统" aria-label="打开 BJTU 邮件系统">
            <svg class="mail-fullscreen-button-icon mail-fullscreen-button-icon-envelope"
                viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                <path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
            </svg>
            <img class="mail-fullscreen-button-icon mail-fullscreen-button-icon-system"
                src="https://mail.bjtu.edu.cn/favicon.ico" width="24" height="24" alt="" hidden>
        </button>
        <button id="academic-fullscreen-button" class="fullscreen-module-button academic-fullscreen-button" data-module="academic"
            type="button" title="教务系统" aria-label="打开教务系统">
            <svg class="academic-fullscreen-button-icon academic-fullscreen-button-icon-graduation"
                viewBox="0 0 24 24" width="23" height="23" aria-hidden="true">
                <path fill="currentColor" d="M12 3 1 9l4 2.18v6L12 21l7-3.82v-6L21 10.09V17h2V9L12 3zm0 2.27L18.85 9 12 12.73 5.15 9 12 5.27zM7 12.27l5 2.73 5-2.73V16l-5 2.73L7 16v-3.73z"/>
            </svg>
            <img class="academic-fullscreen-button-icon academic-fullscreen-button-icon-system"
                src="https://mis.bjtu.edu.cn/media/module/icon/yjszhjw.png" width="26" height="26" alt="" hidden>
        </button>
    </div>

    <script src="../QR/vendor/qrcode.min.js"></script>
    <script src="../core/module-registry.js"></script>
    <script src="../core/ui-order.js"></script>
    <script src="../core/storage-utils.js"></script>
    <script src="../core/captcha-assets.js"></script>
    <script src="../core/loaders/ve-app-loader.js"></script>
    <script src="../QR/qr-utils.js"></script>
    <script src="../cache/popup-cache.js"></script>
    <script src="../UI/homework-ui.js"></script>
    <script src="../UI/course-card-ui.js"></script>
    <script src="../core/platform-login-ui.js"></script>
    <script src="../core/platform-loader.js"></script>
    <script src="../core/optional-platform-adapters.js"></script>
    <script src="../uploads/saved-uploads.js"></script>
    <script src="../UI/deadline-countdown.js"></script>
    <script src="../uploads/duplicate-dialog-loader.js"></script>
    <script src="../core/option-tips.js"></script>
    <script src="app.js"></script>
    <script src="../uploads/upload-manager.js"></script>
    <script src="../core/loaders/updater-loader.js"></script>
    <script src="../core/loaders/qwen-app-loader.js"></script>
    <script src="../core/toolbar-pin.js"></script>

</body>
</html>
