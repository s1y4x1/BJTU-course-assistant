<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>课程助手</title>
  <script src="ui/theme.js"></script>
  <link rel="stylesheet" href="popup.css" data-popup-content-style>
  <style>
    :root { --popup-width:500px; --popup-height:600px; }
    html,body{margin:0;padding:0;width:var(--popup-width);height:var(--popup-height);overflow:hidden;background:#f8fafc;font-family:system-ui,Segoe UI,Roboto,'Noto Sans SC',sans-serif}
    html[data-color-scheme="dark"],html[data-color-scheme="dark"] body{background:#0f172a}
    body{display:block}
    #popup-frame{display:block;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="popup-frame" src="app.html?popup=1" title="课程助手窗口" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-downloads"></iframe>
  <script src="popup.js"></script>
</body>
</html>
